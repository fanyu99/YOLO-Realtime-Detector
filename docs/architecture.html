<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLO application architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#5a6580; --rule:rgba(45,49,66,.12); --accent:#bf4520; --link:#2e5aa8; --sans:'Geist',system-ui,sans-serif; --serif:'Instrument Serif',Georgia,serif; --mono:'Geist Mono',ui-monospace,monospace; }
    body { min-height:100vh; padding:32px 24px; background:var(--paper); color:var(--ink); font-family:var(--sans); }
    .frame { max-width:1200px; margin:auto; }
    .eyebrow { margin-bottom:8px; color:var(--muted); font:500 11px var(--mono); letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin-bottom:22px; font:400 34px/1.1 var(--serif); letter-spacing:-.02em; }
    .diagram-container { width:100%; overflow-x:auto; }
    svg { display:block; width:100%; min-width:1200px; }
    @media print { body { padding:0; } .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · YOLO realtime detector</p>
    <h1>From QML action to CPU or GPU inference</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="yolo-architecture-title yolo-architecture-desc">
        <title id="yolo-architecture-title">YOLO application architecture</title>
        <desc id="yolo-architecture-desc">The QML interface submits jobs through the application layer, where a worker creates a session that pairs frame sources with CPU or GPU detection flows before results return to the UI and output services.</desc>
        <defs>
          <marker id="yolo-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
          <marker id="yolo-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
          <marker id="yolo-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="1200" height="760" fill="#f5f5f5"/>

        <!-- zones -->
        <rect x="24" y="72" width="1152" height="136" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
        <rect x="24" y="228" width="1152" height="220" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
        <rect x="24" y="468" width="1152" height="170" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
        <rect x="24" y="658" width="1152" height="62" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
        <rect x="40" y="76" width="72" height="14" rx="2" fill="#f5f5f5"/><text x="76" y="86" text-anchor="middle" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="1.5">UI LAYER</text>
        <rect x="40" y="232" width="132" height="14" rx="2" fill="#f5f5f5"/><text x="106" y="242" text-anchor="middle" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="1.5">APPLICATION LAYER</text>
        <rect x="40" y="472" width="84" height="14" rx="2" fill="#f5f5f5"/><text x="82" y="482" text-anchor="middle" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="1.5">CORE LAYER</text>
        <rect x="40" y="662" width="126" height="14" rx="2" fill="#f5f5f5"/><text x="103" y="672" text-anchor="middle" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="1.5">EXTERNAL RUNTIME</text>

        <!-- arrows first -->
        <path d="M180 148 H244" fill="none" stroke="#bf4520" stroke-width="1.8" marker-end="url(#yolo-arrow-accent)"/>
        <path d="M376 148 H440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#yolo-arrow)"/>
        <path d="M572 148 V264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#yolo-arrow)"/>
        <path d="M680 316 H740" fill="none" stroke="#bf4520" stroke-width="1.8" marker-end="url(#yolo-arrow-accent)"/>
        <path d="M806 372 V520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#yolo-arrow)"/>
        <path d="M914 520 V408 H974" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#yolo-arrow)"/>
        <path d="M1040 372 V520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#yolo-arrow)"/>
        <path d="M914 584 V690 H844" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#yolo-arrow-link)"/>
        <path d="M974 316 H914 V690 H844" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#yolo-arrow-link)"/>

        <!-- labels with masks -->
        <rect x="186" y="128" width="52" height="16" rx="2" fill="#f5f5f5"/><text x="212" y="139" text-anchor="middle" fill="#bf4520" font-size="9" font-family="'Geist Mono',monospace">submit</text>
        <rect x="388" y="128" width="44" height="16" rx="2" fill="#f5f5f5"/><text x="410" y="139" text-anchor="middle" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">job</text>
        <rect x="584" y="198" width="54" height="16" rx="2" fill="#f5f5f5"/><text x="611" y="209" text-anchor="middle" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">create</text>
        <rect x="694" y="296" width="48" height="16" rx="2" fill="#f5f5f5"/><text x="718" y="307" text-anchor="middle" fill="#bf4520" font-size="9" font-family="'Geist Mono',monospace">session</text>
        <rect x="812" y="432" width="68" height="16" rx="2" fill="#f5f5f5"/><text x="846" y="443" text-anchor="middle" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">FrameHandle</text>
        <rect x="1050" y="432" width="68" height="16" rx="2" fill="#f5f5f5"/><text x="1084" y="443" text-anchor="middle" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">results</text>

        <!-- nodes -->
        <g><rect x="64" y="116" width="116" height="64" rx="6" fill="rgba(79,93,117,.10)" stroke="#5a6580"/><rect x="76" y="128" width="34" height="14" rx="2" fill="#f5f5f5"/><text x="93" y="138" text-anchor="middle" fill="#5a6580" font-size="8" font-family="'Geist Mono',monospace">UI</text><text x="76" y="160" fill="#2d3142" font-size="15" font-family="'Geist',sans-serif" font-weight="600">QML UI</text><text x="76" y="173" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">main.qml · dialogs</text></g>
        <g><rect x="244" y="116" width="132" height="64" rx="6" fill="#fff" stroke="#2d3142"/><rect x="256" y="128" width="58" height="14" rx="2" fill="#f5f5f5"/><text x="285" y="138" text-anchor="middle" fill="#5a6580" font-size="8" font-family="'Geist Mono',monospace">FACADE</text><text x="256" y="160" fill="#2d3142" font-size="15" font-family="'Geist',sans-serif" font-weight="600">DetectionApp</text><text x="256" y="173" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">Q_INVOKABLE · signals</text></g>
        <g><rect x="440" y="116" width="132" height="64" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/><rect x="452" y="128" width="64" height="14" rx="2" fill="#f5f5f5"/><text x="484" y="138" text-anchor="middle" fill="#bf4520" font-size="8" font-family="'Geist Mono',monospace">CONTROL</text><text x="452" y="160" fill="#2d3142" font-size="15" font-family="'Geist',sans-serif" font-weight="600">Manager</text><text x="452" y="173" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">jobs · fallback · cancel</text></g>
        <g><rect x="524" y="264" width="156" height="104" rx="6" fill="#fff" stroke="#2d3142"/><rect x="536" y="276" width="60" height="14" rx="2" fill="#f5f5f5"/><text x="566" y="286" text-anchor="middle" fill="#5a6580" font-size="8" font-family="'Geist Mono',monospace">EXECUTION</text><text x="536" y="310" fill="#2d3142" font-size="15" font-family="'Geist',sans-serif" font-weight="600">Worker + Job</text><text x="536" y="331" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">one job at a time</text><text x="536" y="345" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">tasks run in session</text></g>
        <g><rect x="740" y="284" width="132" height="88" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="1.2"/><rect x="752" y="296" width="62" height="14" rx="2" fill="#f5f5f5"/><text x="783" y="306" text-anchor="middle" fill="#bf4520" font-size="8" font-family="'Geist Mono',monospace">LIFECYCLE</text><text x="752" y="331" fill="#2d3142" font-size="15" font-family="'Geist',sans-serif" font-weight="600">Session</text><text x="752" y="350" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">source + flow pair</text></g>
        <g><rect x="740" y="520" width="132" height="64" rx="6" fill="#fff" stroke="#2d3142"/><rect x="752" y="532" width="48" height="14" rx="2" fill="#f5f5f5"/><text x="776" y="542" text-anchor="middle" fill="#5a6580" font-size="8" font-family="'Geist Mono',monospace">INPUT</text><text x="752" y="564" fill="#2d3142" font-size="14" font-family="'Geist',sans-serif" font-weight="600">FrameSources</text><text x="752" y="577" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">image · video · camera</text></g>
        <g><rect x="974" y="284" width="132" height="88" rx="6" fill="#fff" stroke="#2d3142"/><rect x="986" y="296" width="44" height="14" rx="2" fill="#f5f5f5"/><text x="1008" y="306" text-anchor="middle" fill="#5a6580" font-size="8" font-family="'Geist Mono',monospace">FLOW</text><text x="986" y="331" fill="#2d3142" font-size="15" font-family="'Geist',sans-serif" font-weight="600">CPU / GPU</text><text x="986" y="350" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">pre · infer · NMS</text></g>
        <g><rect x="914" y="520" width="132" height="64" rx="6" fill="rgba(79,93,117,.10)" stroke="#5a6580"/><rect x="926" y="532" width="48" height="14" rx="2" fill="#f5f5f5"/><text x="950" y="542" text-anchor="middle" fill="#5a6580" font-size="8" font-family="'Geist Mono',monospace">APP</text><text x="926" y="564" fill="#2d3142" font-size="14" font-family="'Geist',sans-serif" font-weight="600">Review / Save</text><text x="926" y="577" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">QImage · files · logs</text></g>
        <g><rect x="380" y="678" width="464" height="38" rx="6" fill="rgba(45,49,66,.05)" stroke="#bfc0c0"/><text x="612" y="694" text-anchor="middle" fill="#2d3142" font-size="11" font-family="'Geist',sans-serif" font-weight="600">Qt 6 · ONNX Runtime · OpenCV · FFmpeg · CUDA/cuDNN · Hikvision MVS</text><text x="612" y="707" text-anchor="middle" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">platform and inference dependencies</text></g>

        <!-- legend -->
        <rect x="24" y="732" width="1152" height="20" fill="#ececec"/>
        <text x="40" y="746" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">solid = control or data flow</text>
        <text x="244" y="746" fill="#bf4520" font-size="9" font-family="'Geist Mono',monospace">accent = session boundary</text>
        <text x="462" y="746" fill="#2e5aa8" font-size="9" font-family="'Geist Mono',monospace">dashed = runtime dependency</text>
        <text x="758" y="746" fill="#5a6580" font-size="9" font-family="'Geist Mono',monospace">FrameHandle keeps storage details behind the core API</text>
      </svg>
    </div>
  </main>
</body>
</html>
